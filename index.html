<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>循環倒數計時器</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="倒數">
<style>
  :root {
    --bg: #f2f2f7;
    --card: rgba(255, 255, 255, 0.72);
    --card-border: rgba(255, 255, 255, 0.6);
    --text: #1c1c1e;
    --text-2: #6e6e73;
    --track: rgba(60, 60, 67, 0.12);
    --fill: rgba(120, 120, 128, 0.16);
    --blue: #0a84ff;
    --orange: #ff9f0a;
    --green: #30d158;
    --red: #ff453a;
    --accent: var(--blue);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000;
      --card: rgba(44, 44, 46, 0.66);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f5f5f7;
      --text-2: #98989f;
      --track: rgba(235, 235, 245, 0.14);
      --fill: rgba(120, 120, 128, 0.32);
    }
  }
  @media (prefers-contrast: more) {
    :root { --card: var(--bg); --card-border: var(--text-2); }
  }
  @media (prefers-reduced-transparency: reduce) {
    .card, .toast { background: var(--bg) !important; backdrop-filter: none !important; }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; } /* no double-tap zoom */
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 100%/1.5 system-ui, -apple-system, "SF Pro Text", "PingFang TC", sans-serif;
    display: grid;
    place-items: center;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    transition: background-color 0.6s ease;
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    background: radial-gradient(60% 50% at 50% 0%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%);
    transition: background 0.8s ease;
    pointer-events: none;
  }

  main { position: relative; width: min(100%, 26rem); display: grid; gap: 1rem; }

  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 1.75rem;
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
  }

  /* ---------- Dial ---------- */
  .dial { padding: 1.75rem 1.5rem 1.5rem; text-align: center; }
  .ring-wrap { position: relative; width: min(72vw, 17rem); aspect-ratio: 1; margin: 0 auto; }
  svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .track, .bar { fill: none; stroke-width: 10; }
  .track { stroke: var(--track); }
  .bar { stroke: var(--accent); stroke-linecap: round; transition: stroke 0.5s ease; }
  .readout { position: absolute; inset: 0; display: grid; place-content: center; gap: 0.15rem; }
  .phase { font-size: 0.95rem; font-weight: 600; color: var(--accent); letter-spacing: 0.02em; transition: color 0.5s ease; }
  .time {
    font-size: clamp(3rem, 15vw, 4.25rem);
    font-weight: 600;
    line-height: 1.05;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
  }
  .round { font-size: 0.9rem; color: var(--text-2); }

  .controls { display: flex; justify-content: center; gap: 0.75rem; margin-top: 1.5rem; }
  .btn {
    appearance: none; border: 0; cursor: pointer;
    font: inherit; font-weight: 600; font-size: 1.05rem;
    min-width: 7rem; padding: 0.85rem 1.5rem;
    border-radius: 999px;
    background: var(--fill); color: var(--text);
    transition: transform 120ms ease-out, opacity 120ms ease-out, background-color 0.3s;
  }
  .btn:active { transform: scale(0.96); opacity: 0.8; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn:disabled { opacity: 0.35; pointer-events: none; }
  .btn:focus-visible, .row:focus-visible, .col:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 2px; }

  /* ---------- Settings ---------- */
  .settings { padding: 0.25rem 1.25rem; --ih: 44px; }
  .item + .item { border-top: 1px solid var(--track); }
  .row {
    appearance: none; border: 0; background: none; color: inherit; font: inherit; text-align: left;
    width: 100%; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0.9rem 0;
  }
  .label b { display: block; font-weight: 600; }
  .label small { color: var(--text-2); font-size: 0.8rem; }
  .pill {
    min-width: 4.5rem; text-align: center; padding: 0.4rem 0.9rem; border-radius: 999px;
    background: var(--fill); font-weight: 600; font-variant-numeric: tabular-nums;
    transition: background-color 0.3s, color 0.3s, transform 120ms ease-out;
  }
  .row:active .pill { transform: scale(0.95); }
  .item.open .pill { background: var(--accent); color: #fff; }

  /* Wheel picker: native scroll-snap gives momentum, rubber-banding and grab-to-stop for free */
  .panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.4s cubic-bezier(0.32, 0.72, 0, 1); }
  .item.open .panel { grid-template-rows: 1fr; }
  .panel-inner { overflow: hidden; min-height: 0; }
  .wheel { position: relative; display: flex; justify-content: center; gap: 0.5rem; padding: 0.25rem 0 0.75rem; }
  .wheel::before {
    content: ""; position: absolute; left: 0; right: 0; top: calc(0.25rem + var(--ih) * 2); height: var(--ih);
    background: var(--fill); border-radius: 0.7rem;
  }
  .col {
    position: relative; width: 5.5rem; height: calc(var(--ih) * 5); padding-block: calc(var(--ih) * 2);
    overflow-y: auto; scroll-snap-type: y mandatory; scrollbar-width: none; overscroll-behavior: contain;
    touch-action: pan-y; cursor: grab; outline-offset: -2px; border-radius: 0.7rem;
    -webkit-mask-image: linear-gradient(transparent, #000 32%, #000 68%, transparent);
            mask-image: linear-gradient(transparent, #000 32%, #000 68%, transparent);
  }
  .col::-webkit-scrollbar { display: none; }
  .opt {
    height: var(--ih); scroll-snap-align: center; scroll-snap-stop: always;
    display: flex; align-items: center; justify-content: center; gap: 0.2rem;
    font-size: 1.35rem; font-variant-numeric: tabular-nums; color: var(--text-2);
    transition: color 0.15s;
  }
  .opt small { font-size: 0.8rem; font-weight: 500; }
  .opt.sel { color: var(--text); font-weight: 600; }
  .settings.locked, .presets.locked { opacity: 0.5; pointer-events: none; }

  /* ---------- Saved presets ---------- */
  .presets { padding: 0.75rem 1.25rem 0.25rem; }
  .presets-head { display: flex; align-items: center; justify-content: space-between; padding-bottom: 0.4rem; }
  .presets-head h2 { margin: 0; font-size: 1.05rem; font-weight: 600; letter-spacing: -0.01em; }
  .save {
    appearance: none; border: 0; cursor: pointer; font: inherit; font-size: 0.9rem; font-weight: 600;
    padding: 0.4rem 0.95rem; border-radius: 999px; background: var(--fill); color: var(--accent);
    transition: transform 120ms ease-out, opacity 120ms ease-out;
  }
  .save:active { transform: scale(0.95); opacity: 0.7; }
  .preset { display: flex; align-items: center; gap: 0.5rem; border-top: 1px solid var(--track); border-radius: 0.6rem; }
  .apply {
    flex: 1; min-width: 0; appearance: none; border: 0; background: none; color: inherit; font: inherit;
    text-align: left; padding: 0.7rem 0; cursor: pointer; transition: opacity 100ms;
  }
  .apply:active { opacity: 0.5; }
  .apply b { display: block; font-weight: 600; transition: color 0.3s; }
  .apply small { color: var(--text-2); font-size: 0.8rem; }
  .preset.on .apply b { color: var(--accent); }
  .del {
    appearance: none; border: 0; cursor: pointer; width: 2.25rem; height: 2.25rem; border-radius: 50%;
    background: none; color: var(--text-2); font-size: 1.3rem; line-height: 1;
    transition: transform 100ms ease-out, background-color 100ms;
  }
  .del:active { transform: scale(0.88); background: var(--fill); }
  .empty { margin: 0; padding: 0.4rem 0 0.9rem; color: var(--text-2); font-size: 0.85rem; border-top: 1px solid var(--track); padding-top: 0.8rem; }
  @keyframes flash { from { background: color-mix(in srgb, var(--accent) 24%, transparent); } to { background: transparent; } }
  .preset.new { animation: flash 1s ease-out; }

  .toast {
    position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 1rem; padding: 0.65rem 0.5rem 0.65rem 1.25rem;
    border-radius: 999px; font-size: 0.9rem;
    background: var(--card); border: 1px solid var(--card-border);
    backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
    transform: translate(-50%, 200%); pointer-events: none;
    transition: transform 0.45s cubic-bezier(0.32, 0.72, 0, 1);
  }
  .toast.show { transform: translate(-50%, 0); pointer-events: auto; }
  .toast button {
    appearance: none; border: 0; background: none; cursor: pointer; font: inherit; font-weight: 600;
    color: var(--accent); padding: 0.35rem 0.9rem; border-radius: 999px;
  }
  .toast button:active { background: var(--fill); }

  /* Done pulse */
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.05); } 100% { transform: scale(1); } }
  .ring-wrap.pop { animation: pop 0.5s cubic-bezier(.3,1.4,.5,1); }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; animation: none !important; }
  }
</style>
</head>
<body>
<main>
  <section class="card dial" aria-live="polite">
    <div class="ring-wrap" id="ringWrap">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle class="track" cx="50" cy="50" r="45"/>
        <circle class="bar" id="bar" cx="50" cy="50" r="45"/>
      </svg>
      <div class="readout">
        <div class="phase" id="phase">準備開始</div>
        <div class="time" id="time">00:10</div>
        <div class="round" id="round">共 3 輪</div>
      </div>
    </div>
    <div class="controls">
      <button class="btn" id="reset" disabled>重設</button>
      <button class="btn primary" id="main">開始</button>
    </div>
  </section>

  <section class="card presets" id="presets">
    <div class="presets-head">
      <h2>我的設定</h2>
      <button type="button" class="save" id="savePreset">＋ 儲存目前設定</button>
    </div>
    <div id="presetList" role="list"></div>
  </section>

  <section class="card settings" id="settings"></section>
</main>
<div class="toast" id="toast" role="status"><span id="toastText"></span><button type="button" id="toastUndo">復原</button></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const els = {
    bar: $('bar'), phase: $('phase'), time: $('time'), round: $('round'),
    main: $('main'), reset: $('reset'), settings: $('settings'),
    ringWrap: $('ringWrap'),
  };
  const root = document.documentElement;
  const C = 2 * Math.PI * 45;
  els.bar.style.strokeDasharray = C;

  /* ---------- Settings (persisted) ---------- */
  const KEY = 'loop-countdown-v1';
  const cfg = { duration: 10, gap: 3, rounds: 3, sayRun: 5, sayRest: 10 };
  try { Object.assign(cfg, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch {}
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  function save() { try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch {} }

  /* ---------- Wheel pickers ---------- */
  const IH = 44;                                  // keep in sync with --ih
  const secPill = (v) => `${v} 秒`;
  const voicePill = (v) => (v ? `${v} 秒` : '關閉');
  const VOICE = { min: 0, max: 60, unit: '秒', zero: '關閉' };
  const ROWS = [
    { key: 'duration', title: '倒數時間', sub: '每一輪倒數多久',
      cols: [{ min: 0, max: 60, unit: '分' }, { min: 0, max: 59, unit: '秒' }],
      read: ([m, s]) => clamp(m * 60 + s, 1, 3600),
      write: (v) => [Math.floor(v / 60), v % 60], pill: (v) => fmt(v) },
    { key: 'gap', title: '間隔', sub: '每輪之間休息的秒數', cols: [{ min: 0, max: 600, unit: '秒' }], pill: secPill },
    { key: 'rounds', title: '重複次數', sub: '總共倒數幾輪', cols: [{ min: 1, max: 999, unit: '輪' }], pill: (v) => `${v} 輪` },
    { key: 'sayRun', title: '倒數語音', sub: '最後幾秒開始唸，0 為關閉', cols: [VOICE], pill: voicePill },
    { key: 'sayRest', title: '間隔語音', sub: '最後幾秒開始唸，0 為關閉', cols: [VOICE], pill: voicePill },
  ];

  const items = ROWS.map((row) => {
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = '<button type="button" class="row" aria-expanded="false"><span class="label"><b></b><small></small></span><span class="pill"></span></button>' +
                   '<div class="panel" inert><div class="panel-inner"><div class="wheel"></div></div></div>';
    el.querySelector('b').textContent = row.title;
    el.querySelector('small').textContent = row.sub;
    els.settings.append(el);
    const o = { row, el, btn: el.querySelector('.row'), pill: el.querySelector('.pill'),
                panel: el.querySelector('.panel'), wheel: el.querySelector('.wheel'), cols: null };
    o.btn.onclick = () => {
      const open = o.btn.getAttribute('aria-expanded') !== 'true';
      closeAll();
      if (open) setOpen(o, true);
    };
    return o;
  });

  function setOpen(o, on) {
    if (on && !o.cols) build(o);
    o.btn.setAttribute('aria-expanded', on);
    o.el.classList.toggle('open', on);
    o.panel.inert = !on;
    if (on) syncWheel(o);
  }
  function closeAll() { items.forEach((o) => setOpen(o, false)); }
  function refreshPills() { items.forEach((o) => { o.pill.textContent = o.row.pill(cfg[o.row.key]); }); updateActive(); }

  function mark(col, idx) {
    col._sel?.classList.remove('sel');
    col._sel = col.children[idx];
    col._sel?.classList.add('sel');
  }
  function syncWheel(o) {                         // cfg -> wheels (no-op where already in place)
    const vals = (o.row.write || ((v) => [v]))(cfg[o.row.key]);
    o.cols.forEach((col, i) => {
      const idx = vals[i] - o.row.cols[i].min;
      if (col._idx !== idx) { col._idx = idx; col.scrollTop = idx * IH; mark(col, idx); }
    });
  }
  function commit(o) {                            // wheels -> cfg, live while scrolling
    const vals = o.cols.map((col, i) => col._idx + o.row.cols[i].min);
    cfg[o.row.key] = (o.row.read || ((a) => a[0]))(vals);
    save(); refreshPills(); renderIdle();
  }
  function build(o) {                             // lazy: the 600/999-item lists only exist once opened
    o.cols = o.row.cols.map((c) => {
      const col = document.createElement('div');
      col.className = 'col'; col.tabIndex = 0; col._idx = -1;
      col.setAttribute('role', 'listbox');
      col.setAttribute('aria-label', `${o.row.title}（${c.unit}）`);
      const frag = document.createDocumentFragment();
      for (let v = c.min; v <= c.max; v++) {
        const opt = document.createElement('div');
        opt.className = 'opt'; opt.setAttribute('role', 'option');
        opt.innerHTML = v === 0 && c.zero ? c.zero : `${v}<small>${c.unit}</small>`;
        frag.append(opt);
      }
      col.append(frag);
      col.addEventListener('scroll', () => {
        const idx = clamp(Math.round(col.scrollTop / IH), 0, c.max - c.min);
        if (idx !== col._idx) { col._idx = idx; mark(col, idx); buzz(4); commit(o); }
        clearTimeout(col._t); col._t = setTimeout(() => syncWheel(o), 160);  // settle on a clamped value
      }, { passive: true });
      col.addEventListener('click', (e) => {     // tap a neighbouring value to glide to it
        const opt = e.target.closest('.opt');
        if (opt) col.scrollTo({ top: [...col.children].indexOf(opt) * IH, behavior: 'smooth' });
      });
      o.wheel.append(col);
      return col;
    });
  }

  /* ---------- Saved presets: duration / gap / rounds only ---------- */
  const PKEY = 'loop-countdown-presets-v1';
  const MAX_PRESETS = 20;
  const listEl = $('presetList'), toastEl = $('toast');
  const valid = (p) => p && p.duration >= 1 && p.duration <= 3600 && p.gap >= 0 && p.gap <= 600 && p.rounds >= 1 && p.rounds <= 999;
  let presets = [];
  try { presets = JSON.parse(localStorage.getItem(PKEY) || '[]').filter(valid); } catch {}
  const savePresets = () => { try { localStorage.setItem(PKEY, JSON.stringify(presets)); } catch {} };
  const same = (p) => p.duration === cfg.duration && p.gap === cfg.gap && p.rounds === cfg.rounds;
  const humanDur = (t) => t >= 60 ? `${Math.floor(t / 60)} 分${t % 60 ? ` ${t % 60} 秒` : ''}` : `${t} 秒`;

  function renderPresets(flashId) {
    listEl.replaceChildren();
    if (!presets.length) {
      const p = document.createElement('p');
      p.className = 'empty';
      p.textContent = '把常用的倒數、間隔與次數存起來，下次一點就能套用。';
      listEl.append(p);
      return;
    }
    presets.forEach((p) => {
      const row = document.createElement('div');
      row.className = 'preset' + (p.id === flashId ? ' new' : '');
      row.setAttribute('role', 'listitem');
      row.innerHTML = '<button type="button" class="apply"><b></b><small></small></button>' +
                      '<button type="button" class="del" aria-label="刪除">×</button>';
      row.querySelector('b').textContent = `倒數 ${humanDur(p.duration)}`;
      row.querySelector('small').textContent = `間隔 ${p.gap} 秒 · 重複 ${p.rounds} 次`;
      row.querySelector('.apply').onclick = () => applyPreset(p);
      row.querySelector('.del').onclick = () => removePreset(p);
      listEl.append(row);
    });
    updateActive();
  }
  function updateActive() {                       // highlight the preset matching the current settings
    [...listEl.querySelectorAll('.preset')].forEach((row, i) => row.classList.toggle('on', same(presets[i])));
  }
  function applyPreset(p) {
    cfg.duration = p.duration; cfg.gap = p.gap; cfg.rounds = p.rounds;
    save();
    items.forEach((o) => o.cols && syncWheel(o));
    refreshPills(); renderIdle(); buzz(8);
  }
  $('savePreset').onclick = () => {
    const dup = presets.find(same);
    if (dup) return renderPresets(dup.id);        // already saved: just point at it
    if (presets.length >= MAX_PRESETS) return showToast(`最多可儲存 ${MAX_PRESETS} 組`);
    const p = { id: Date.now().toString(36), duration: cfg.duration, gap: cfg.gap, rounds: cfg.rounds };
    presets.unshift(p); savePresets(); renderPresets(p.id); buzz(10);
  };
  function removePreset(p) {
    const at = presets.indexOf(p);
    presets.splice(at, 1); savePresets(); renderPresets();
    showToast('已刪除', () => { presets.splice(at, 0, p); savePresets(); renderPresets(p.id); });
  }

  let toastTimer = 0, toastUndo = null;
  function showToast(text, undo) {
    $('toastText').textContent = text;
    toastUndo = undo || null;
    $('toastUndo').hidden = !undo;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 5000);
  }
  $('toastUndo').onclick = () => { toastEl.classList.remove('show'); toastUndo && toastUndo(); toastUndo = null; };

  /* ---------- Helpers ---------- */
  function fmt(sec) {
    const s = Math.max(0, Math.ceil(sec));
    return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  }
  const COLORS = { idle: 'var(--blue)', run: 'var(--blue)', rest: 'var(--orange)', done: 'var(--green)' };

  /* ---------- Feedback: sound + haptic on the same frame ---------- */
  let audio;
  function beep(freq = 880, dur = 0.16, vol = 0.2) {
    try {
      audio ||= new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = freq; o.type = 'sine';
      g.gain.setValueAtTime(vol, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + dur);
      o.connect(g).connect(audio.destination);
      o.start(); o.stop(audio.currentTime + dur);
    } catch {}
  }
  const D = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
  const zh = (n) => n < 10 ? D[n] : n < 20 ? '十' + D[n - 10] : D[Math.floor(n / 10)] + '十' + D[n % 10];
  function say(text) {
    try {
      const synth = window.speechSynthesis;
      if (!synth) return;
      synth.cancel();                    // never queue stale numbers
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'zh-TW'; u.rate = 1.1;
      const v = synth.getVoices().find((x) => /zh[-_]TW/i.test(x.lang)) ||
                synth.getVoices().find((x) => /^zh/i.test(x.lang));
      if (v) u.voice = v;
      synth.speak(u);
    } catch {}
  }
  const stopSpeech = () => { try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch {} };
  const buzz = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };

  /* ---------- State machine (timestamp-based, drift-free) ---------- */
  let state = 'idle';            // idle | run | rest | done
  let paused = false;
  let round = 1;
  let announced = false;         // 「準備開始」 spoken for this rest yet?
  let lead = false;              // opening rest before round 1
  let phaseStart = 0, phaseLen = 0, remainingAtPause = 0;
  let raf = 0, lastWhole = -1;

  const now = () => performance.now() / 1000;

  function startPhase(kind, len) {
    state = kind; phaseLen = len; phaseStart = now(); lastWhole = -1;
    announced = false;
    document.title = '循環倒數計時器';
  }

  function remaining() { return paused ? remainingAtPause : Math.max(0, phaseLen - (now() - phaseStart)); }

  function render() {
    const rem = remaining();
    const showing = state === 'done' ? 0 : rem;
    els.time.textContent = fmt(showing);
    const progress = phaseLen ? rem / phaseLen : 0;
    els.bar.style.strokeDashoffset = C * (1 - (state === 'done' ? 1 : progress));
    root.style.setProperty('--accent', COLORS[state]);

    if (state === 'run') {
      els.phase.textContent = paused ? '已暫停' : '倒數中';
      els.round.textContent = `第 ${round} / ${cfg.rounds} 輪`;
    } else if (state === 'rest') {
      els.phase.textContent = paused ? '已暫停' : lead ? '準備開始' : '休息一下';
      els.round.textContent = `下一輪：第 ${lead ? round : round + 1} / ${cfg.rounds} 輪`;
    } else if (state === 'done') {
      els.phase.textContent = '完成';
      els.round.textContent = `已完成 ${cfg.rounds} 輪`;
    }
    if (state === 'run' || state === 'rest') document.title = `${fmt(rem)} · ${els.phase.textContent}`;
  }

  function renderIdle() {
    if (state !== 'idle') return;
    phaseLen = cfg.duration;
    els.time.textContent = fmt(cfg.duration);
    els.bar.style.strokeDashoffset = 0;
    els.phase.textContent = '準備開始';
    els.round.textContent = `共 ${cfg.rounds} 輪 · 間隔 ${cfg.gap} 秒`;
    root.style.setProperty('--accent', COLORS.idle);
  }

  function tick() { step(); raf = requestAnimationFrame(tick); }

  // rAF stops in background tabs; keep the phases (and beeps) advancing there.
  setInterval(() => { if (document.hidden) step(); }, 250);

  function step() {
    if (!paused && (state === 'run' || state === 'rest')) {
      const rem = remaining();
      const whole = Math.ceil(rem);
      if (whole !== lastWhole) {          // count aloud from the user-chosen second, separately for run and rest
        lastWhole = whole;
        const from = state === 'rest' ? cfg.sayRest : cfg.sayRun;
        if (whole > 0 && whole <= from) {
          if (state === 'rest' && !announced) { announced = true; say('準備開始'); }  // right before the numbers
          else say(zh(whole));
        }
      }
      if (rem <= 0) advance();
      render();
    }
  }

  function advance() {
    if (state === 'run') {
      if (round >= cfg.rounds) return finish();
      say('時間到'); buzz(80);
      if (cfg.gap > 0) startPhase('rest', cfg.gap);
      else { round++; startPhase('run', cfg.duration); }
    } else if (state === 'rest') {
      if (lead) lead = false; else round++;
      say('開始'); buzz(40);
      startPhase('run', cfg.duration);
    }
  }

  function finish() {
    state = 'done'; paused = false;
    say('時間到'); buzz([100, 60, 100]);
    els.ringWrap.classList.remove('pop'); void els.ringWrap.offsetWidth; els.ringWrap.classList.add('pop');
    document.title = '完成 · 循環倒數計時器';
    setUI();
  }

  /* ---------- Keep the screen awake while a timer is running ---------- */
  let wake = null;
  async function syncWake() {
    const want = (state === 'run' || state === 'rest') && !paused;
    try {
      if (want && !wake && navigator.wakeLock && !document.hidden) {
        wake = await navigator.wakeLock.request('screen');
        wake.addEventListener('release', () => { wake = null; });
      } else if (!want && wake) {
        await wake.release(); wake = null;
      }
    } catch { wake = null; }
  }
  // The lock is dropped whenever the tab is hidden; take it back on return.
  document.addEventListener('visibilitychange', () => { if (!document.hidden) syncWake(); });

  function setUI() {
    syncWake();
    if (state === 'run' || state === 'rest') closeAll();
    const running = state === 'run' || state === 'rest';
    els.settings.classList.toggle('locked', running || paused);
    $('presets').classList.toggle('locked', running || paused);
    els.reset.disabled = state === 'idle';
    els.main.textContent =
      state === 'idle' ? '開始' :
      state === 'done' ? '再來一次' :
      paused ? '繼續' : '暫停';
    render();
  }

  els.main.onclick = () => {
    say('');                             // unlock speech on user gesture
    if (state === 'idle' || state === 'done') {
      round = 1; paused = false;
      lead = cfg.sayRest > 0;           // opening lead-in lasts only as long as the spoken rest countdown
      if (lead) startPhase('rest', cfg.sayRest); else startPhase('run', cfg.duration);
    } else if (paused) {
      paused = false; phaseStart = now() - (phaseLen - remainingAtPause);
    } else {
      remainingAtPause = remaining(); paused = true; stopSpeech();
    }
    setUI();
  };

  els.reset.onclick = () => {
    state = 'idle'; paused = false; round = 1; lead = false; stopSpeech();
    document.title = '循環倒數計時器';
    setUI(); renderIdle();
  };

  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); els.main.click(); }
    if (e.key === 'r' && !els.reset.disabled) els.reset.click();
  });

  renderPresets();
  refreshPills();
  renderIdle();
  setUI(); renderIdle();
  raf = requestAnimationFrame(tick);
})();
</script>
</body>
</html>
